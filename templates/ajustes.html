<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="UTF-8">
    <title>{{ app_name }} - Ajustes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800 dark:text-slate-100 relative">
    <!-- Dark Mode Switch -->
    <div class="absolute top-4 right-4">
        <button id="themeToggle"
            class="p-3 bg-white dark:bg-slate-800 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 hover:scale-105 transition-transform text-slate-600 dark:text-slate-300">
            <i data-lucide="moon" id="moonIcon"></i>
            <i data-lucide="sun" id="sunIcon" class="hidden"></i>
        </button>
    </div>

    <div
        class="bg-white dark:bg-slate-800 p-10 rounded-[3.5rem] shadow-2xl max-w-md w-full border border-slate-100 dark:border-slate-700 transition-colors duration-300">
        <h2
            class="text-2xl font-black mb-8 tracking-tighter text-center italic dark:text-white flex items-center justify-center gap-2">
            <i data-lucide="settings-2" class="w-6 h-6"></i>
            Configuración de Seguridad
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="flex flex-col items-center mb-6">
                <div class="relative group">
                    {% if user.foto_perfil == 'default_user.png' %}
                    <div
                        class="w-28 h-28 rounded-full bg-blue-600 dark:bg-blue-500 flex items-center justify-center text-white font-bold text-5xl border-4 border-white dark:border-slate-800 shadow-xl">
                        {{ user.nombre[0]|upper }}{{ user.nombre.split()[-1][0]|upper if user.nombre.split()|length > 1
                        else '' }}
                    </div>
                    {% else %}
                    <img src="{{ url_for('get_image', subdir='perfiles', filename=user.foto_perfil) }}"
                        class="w-28 h-28 rounded-full object-cover border-4 border-white dark:border-slate-800 shadow-xl">
                    {% endif %}
                    <div
                        class="absolute bottom-0 right-0 p-2 bg-blue-600 dark:bg-blue-500 rounded-full text-white shadow-lg pointer-events-none group-hover:scale-110 transition-transform">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                    </div>
                </div>
                <input type="file" name="foto"
                    class="mt-4 w-full text-[10px] font-bold text-slate-400 dark:text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 dark:file:bg-slate-700 file:text-blue-700 dark:file:text-blue-400 cursor-pointer">
            </div>

            <input type="text" name="nombre" value="{{ user.nombre }}"
                class="w-full p-4 bg-slate-50 dark:bg-slate-700 dark:text-white rounded-2xl border-none font-bold outline-none focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/50 transition-all"
                placeholder="Tu Nombre">

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label
                        class="text-[9px] font-black text-slate-400 dark:text-slate-500 ml-2 uppercase flex items-center gap-1"><i
                            data-lucide="hand" class="w-3 h-3"></i> Gesto 1</label>
                    <select name="gesto1"
                        class="w-full p-4 bg-slate-100 dark:bg-slate-700 dark:text-white rounded-2xl border-none outline-none focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/50 text-sm font-bold transition-all">
                        <option value="Thumb_Up" {% if user.gesto1=='Thumb_Up' %}selected{% endif %}>Pulgar Arriba
                        </option>
                        <option value="Victory" {% if user.gesto1=='Victory' %}selected{% endif %}>Victoria</option>
                        <option value="Open_Palm" {% if user.gesto1=='Open_Palm' %}selected{% endif %}>Palma Abierta
                        </option>
                        <option value="Pointing_Up" {% if user.gesto1=='Pointing_Up' %}selected{% endif %}>Señalar
                            Arriba</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label
                        class="text-[9px] font-black text-slate-400 dark:text-slate-500 ml-2 uppercase flex items-center gap-1"><i
                            data-lucide="hand" class="w-3 h-3"></i> Gesto 2</label>
                    <select name="gesto2"
                        class="w-full p-4 bg-slate-100 dark:bg-slate-700 dark:text-white rounded-2xl border-none outline-none focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/50 text-sm font-bold transition-all">
                        <option value="Open_Palm" {% if user.gesto2=='Open_Palm' %}selected{% endif %}>Palma Abierta
                        </option>
                        <option value="Victory" {% if user.gesto2=='Victory' %}selected{% endif %}>Victoria</option>
                        <option value="ILoveYou" {% if user.gesto2=='ILoveYou' %}selected{% endif %}>Te Amo</option>
                        <option value="Thumb_Up" {% if user.gesto2=='Thumb_Up' %}selected{% endif %}>Pulgar Arriba
                        </option>
                    </select>
                </div>
            </div>

            <button
                class="flex items-center justify-center gap-2 w-full py-4 bg-slate-800 dark:bg-blue-600 text-white rounded-2xl font-bold hover:bg-black dark:hover:bg-blue-700 transition-all shadow-lg active:scale-95">
                <i data-lucide="save" class="w-4 h-4"></i>
                Actualizar Perfil
            </button>
            <a href="/dashboard"
                class="block text-center text-slate-400 dark:text-slate-500 text-xs mt-2 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">Cancelar</a>
        </form>
    </div>

    <script>
        lucide.createIcons();

        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        function setTheme(isDark) {
            if (isDark) {
                html.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                localStorage.theme = 'dark';
            } else {
                html.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                localStorage.theme = 'light';
            }
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        themeToggle.addEventListener('click', () => {
            setTheme(!html.classList.contains('dark'));
        });
    </script>
</body>

</html>
